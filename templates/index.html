<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Heart Disease Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            border-radius: 20px;
        }
        .form-label img {
            height: 20px;
            margin-left: 5px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Heart Disease Prediction</h1>
        
        <!-- Add the image here -->
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='defining-heart-attack.jpg') }}" 
                 alt="Heart Attack Diagram" 
                 class="img-fluid rounded"
                 style="max-width: 600px;">
        </div>

        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0 text-center">🫀 Heart Disease Prediction</h3>
            </div>
            <div class="card-body">
                <form method="POST" class="row g-3">
                    
                    <!-- Age -->
                    <div class="col-md-6">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" min="0" max="120" step="1" class="form-control" name="age" required>
                    </div>

                    <!-- Sex -->
                    <div class="col-md-6">
                        <label for="sex" class="form-label">Sex</label>
                        <select name="sex" class="form-select" required>
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <!-- Chest Pain Type -->
                    <div class="col-md-6">
                        <label for="cp" class="form-label">Chest Pain Type</label>
                        <select name="cp" class="form-select" required>
                            <option value="0">Typical Angina</option>
                            <option value="1">Atypical Angina</option>
                            <option value="2">Non-anginal Pain</option>
                            <option value="3">Asymptomatic</option>
                        </select>
                    </div>

                    <!-- Resting Blood Pressure -->
                    <div class="col-md-6">
                        <label for="trestbps" class="form-label">Resting Blood Pressure (mmHg)</label>
                        <input type="number" min="80" max="200" step="1" class="form-control" name="trestbps" required>
                    </div>

                    <!-- Cholesterol -->
                    <div class="col-md-6">
                        <label for="chol" class="form-label">Cholesterol (mg/dL)</label>
                        <input type="number" min="100" max="600" step="1" class="form-control" name="chol" required>
                    </div>

                    <!-- Fasting Blood Sugar -->
                    <div class="col-md-6">
                        <label for="fbs" class="form-label">Fasting Blood Sugar > 120 mg/dL</label>
                        <select name="fbs" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <!-- Resting ECG -->
                    <div class="col-md-6">
                        <label for="restecg" class="form-label">Resting ECG Results</label>
                        <select name="restecg" class="form-select" required>
                            <option value="0">Normal</option>
                            <option value="1">ST-T Abnormality</option>
                            <option value="2">Left Ventricular Hypertrophy</option>
                        </select>
                    </div>

                    <!-- Max Heart Rate -->
                    <div class="col-md-6">
                        <label for="thalach" class="form-label">Max Heart Rate Achieved</label>
                        <input type="number" min="60" max="220" step="1" class="form-control" name="thalach" required>
                    </div>

                    <!-- Exercise Induced Angina -->
                    <div class="col-md-6">
                        <label for="exang" class="form-label">Exercise Induced Angina</label>
                        <select name="exang" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <!-- Oldpeak -->
                    <div class="col-md-6">
                        <label for="oldpeak" class="form-label">ST Depression (oldpeak)</label>
                        <input type="number" min="0" max="6" step="0.1" class="form-control" name="oldpeak" required>
                    </div>

                    <!-- Slope -->
                    <div class="col-md-6">
                        <label for="slope" class="form-label">Slope of ST Segment</label>
                        <select name="slope" class="form-select" required>
                            <option value="0">Upsloping</option>
                            <option value="1">Flat</option>
                            <option value="2">Downsloping</option>
                        </select>
                    </div>

                    <!-- CA -->
                    <div class="col-md-6">
                        <label for="ca" class="form-label">Number of Major Vessels Colored</label>
                        <select name="ca" class="form-select" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>

                    <!-- Thal -->
                    <div class="col-md-6">
                        <label for="thal" class="form-label">Thalassemia</label>
                        <select name="thal" class="form-select" required>
                            <option value="1">Normal</option>
                            <option value="2">Fixed Defect</option>
                            <option value="3">Reversible Defect</option>
                        </select>
                    </div>

                    <!-- Submit -->
                    <div class="col-12">
                        <button type="submit" class="btn btn-success w-100">🧪 Predict</button>
                    </div>
                </form>

                {% if prediction %}
                <div class="alert alert-info text-center mt-4" role="alert">
                    <h4 class="mb-0">🔍 Prediction: {{ prediction }}</h4>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
